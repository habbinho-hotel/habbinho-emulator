name: Build & Release JAR

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Emulator

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: Emulator/pom.xml

      - name: Check release tag
        id: version
        run: |
          version=$(./mvnw -B -ntp -q -Dstyle.color=never help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            printf 'Expected tag v%s, got %s\n' "$version" "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build and test release
        run: ./mvnw -B -ntp clean verify

      - name: Validate SBOM and generate SHA-256 checksum
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          cd target
          jq -e '.components | length > 0' "Polaris-$VERSION-sbom.json" >/dev/null
          jar="Polaris-$VERSION-jar-with-dependencies.jar"
          sha256sum "$jar" > "$jar.sha256"

      - name: Attest release JAR provenance
        uses: actions/attest@v4
        with:
          subject-path: Emulator/target/Polaris-${{ steps.version.outputs.value }}-jar-with-dependencies.jar

      - name: Attest release SBOM
        uses: actions/attest@v4
        with:
          subject-path: Emulator/target/Polaris-${{ steps.version.outputs.value }}-jar-with-dependencies.jar
          sbom-path: Emulator/target/Polaris-${{ steps.version.outputs.value }}-sbom.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            Emulator/target/Polaris-${{ steps.version.outputs.value }}-jar-with-dependencies.jar
            Emulator/target/Polaris-${{ steps.version.outputs.value }}-jar-with-dependencies.jar.sha256
            Emulator/target/Polaris-${{ steps.version.outputs.value }}-sbom.json
